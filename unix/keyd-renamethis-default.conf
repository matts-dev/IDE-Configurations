# This file goes in /etc/keyd/default.conf 
[ids]
*

# These mappings are explicit, to allow pass through for a lot of keybinds
[main]
# NOTE: having overload makes alt-navigaion require you release alt, so just using layer
#leftalt=overload(alt_alias,leftalt)
leftalt=layer(alt_alias)

# :A makes this behave like alt, overload stops certain things like alt+f for file in vscode
[alt_alias:A]
j = left
i = up
l = right
k = down
o = end
u = home

[alt_alias+shift]
j = S-left
i = S-up
l = S-right
k = S-down
#o = S-end #disable so we can restore pass through
o = A-S-o
u = S-home

[alt_alias+control]
j = C-left
i = up   
l = C-right
k = down  
o = end 
u = home
p = forward
y = back

[alt_alias+control+shift]
j = S-C-left
i = S-up
l = S-C-right
k = S-down
o = S-end
u = S-home
p = forward
y = back

[control+shift]
#i = pageup
#k = pagedown
# maro 10 ups feels better than a full page up/down
i = macro(up  up  up  up  up  up  up  up  up  up)
k = macro(down down down down down down down down down down)
